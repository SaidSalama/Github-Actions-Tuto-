name: Conditional Steps on Manual Trigger

on:
  #push:
  workflow_dispatch:

jobs:
  conditional-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Step that always runs
        run: echo "This step runs on any trigger (push or manual)."

      - name: Step only for manual trigger
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "This step only runs when triggered manually."

      - name: Step only for push
        if: ${{ github.event_name == 'push' }}
        run: echo "This step only runs on push."
